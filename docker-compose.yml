# Default compose — points to dev config.
# Use explicitly for clarity:
#   docker compose -f compose.dev.yml  up -d   # local development
#   docker compose -f compose.prod.yml up -d   # NAS / production
#
# This file mirrors compose.dev.yml so `docker compose up` still works.

services:
  bf6-tracker:
    build: .
    image: bf6-tracker:0.0.7.9
    container_name: bf6-tracker-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BF6_DB_PATH: /app/data/bf6_stats.db
      BF6_CORS_ORIGINS: "any"
      BF6_SUSPICION_CORS_ORIGIN: ""
      BF6_REPORTER_COOKIE_SECURE: "false"
      BF6_REPORTER_COOKIE_SAMESITE: "lax"
      BF6_REPORTER_COOKIE_SECRET: "change-me-for-any-shared-environment"
      BF6_POLL_ENABLED: "true"
      BF6_POLL_INTERVAL_SECONDS: "300"
      BF6_POLL_BATCH_SIZE: "20"
      BF6_POLL_BATCH_WORKERS: "4"
      BF6_POLL_PROFILE_WORKERS: "4"
      BF6_POLL_STAGGER_SECONDS: "0.0"
      BF6_POLL_LOG_BATCH_SUCCESS: "false"
      BF6_TRACKED_COUNTS_ENABLED: "true"
      BF6_TRACKED_COUNTS_INTERVAL_SECONDS: "900"
      TZ: Europe/London
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
